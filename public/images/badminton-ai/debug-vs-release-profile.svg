<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="dbgTitle dbgDesc" font-family="Arial, Helvetica, sans-serif">
  <title id="dbgTitle">빌드 최적화에 따른 셔틀 처리 시간 구성 변화</title>
  <desc id="dbgDesc">Debug 빌드에서는 히트맵 디코드가 셔틀 처리 시간의 92퍼센트를 차지했지만, Release 빌드에서는 24퍼센트였습니다. 프레임당 디코드 시간은 0.0998초에서 0.0028초로 36배 차이가 났습니다.</desc>

  <rect id="__bg__" x="-8" y="-8" width="776" height="266" fill="#f4f4f2"></rect>

  <text x="0" y="18" font-size="12.5" fill="#111">같은 코드 · 같은 기기 · 같은 영상. 차이는 빌드 최적화뿐입니다.</text>

  <g font-size="13" fill="#111" text-anchor="end">
    <text x="130" y="72">Debug</text>
    <text x="130" y="152">Release</text>
  </g>

  <g>
    <rect x="146" y="50" width="533.6" height="34" fill="#111"></rect>
    <rect x="679.6" y="50" width="46.4" height="34" fill="#cfcfcb" stroke="#111" stroke-width="1"></rect>
    <text x="150" y="72" font-size="13" fill="#f4f4f2">히트맵 디코드 92%</text>

    <rect x="146" y="130" width="139.2" height="34" fill="#111"></rect>
    <rect x="285.2" y="130" width="440.8" height="34" fill="#cfcfcb" stroke="#111" stroke-width="1"></rect>
    <text x="150" y="152" font-size="13" fill="#f4f4f2">24%</text>
    <text x="292" y="152" font-size="13" fill="#111">나머지 처리 76%</text>
  </g>

  <line x1="146" y1="190" x2="726" y2="190" stroke="#aaa" stroke-width="1"></line>

  <g font-size="12.5">
    <text x="146" y="212" fill="#606060">프레임당 디코드 시간</text>
    <text x="330" y="212" fill="#111">0.0998초</text>
    <text x="410" y="212" fill="#606060">→</text>
    <text x="440" y="212" fill="#111">0.0028초</text>
    <text x="530" y="212" fill="#606060">36배 차이</text>
  </g>
  <text x="146" y="236" font-size="11" fill="#606060">iPhone 16 · iOS 26.5 · 동일 60초 구간</text>
</svg>
